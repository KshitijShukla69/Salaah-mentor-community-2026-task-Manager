<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    :root {
      --bg: #eef1f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 14px;
      transition: background 0.3s, color 0.3s;
    }
    .app {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px;
      height: fit-content;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    h1 { font-size: 1.6rem; }
    #theme-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text);
    }
    .add-form { display: flex; gap: 8px; margin-bottom: 16px; }
    .add-form input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
      min-width: 0;
    }
    .add-form input:focus { border-color: var(--primary); }
    .add-form button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-form button:hover { background: var(--primary-dark); }
    .filters { display: flex; gap: 8px; margin-bottom: 14px; }
    .filter-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      animation: pop 0.25s ease;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--success);
      cursor: pointer;
      flex-shrink: 0;
    }
    .task-text { flex: 1; word-break: break-word; }
    li.completed .task-text { text-decoration: line-through; color: var(--muted); }
    .edit-input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid var(--primary);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      min-width: 0;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 6px;
      border-radius: 6px;
    }
    .icon-btn:hover { background: var(--border); }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    #clear-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    @media (max-width: 420px) {
      .app { padding: 16px; }
      h1 { font-size: 1.35rem; }
      .add-form button { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📝 Task Manager</h1>
      <button id="theme-btn" title="Toggle dark mode">🌙</button>
    </header>

    <form class="add-form" id="task-form">
      <input type="text" id="task-input" placeholder="Add a new task..." maxlength="120" autocomplete="off" />
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>

    <footer>
      <span id="counter">0 tasks left</span>
      <button id="clear-btn">Clear completed</button>
    </footer>
  </div>

  <script>
    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");
    const counter = document.getElementById("counter");
    const clearBtn = document.getElementById("clear-btn");
    const themeBtn = document.getElementById("theme-btn");
    const filterBtns = document.querySelectorAll(".filter-btn");

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
    let currentFilter = "all";
    let editingId = null;

    function save() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function render() {
      list.innerHTML = "";

      const visible = tasks.filter((t) => {
        if (currentFilter === "pending") return !t.completed;
        if (currentFilter === "completed") return t.completed;
        return true;
      });

      if (visible.length === 0) {
        const msg = document.createElement("p");
        msg.className = "empty";
        msg.textContent =
          tasks.length === 0 ? "No tasks yet. Add one above! ✨" : "Nothing to show here.";
        list.appendChild(msg);
      }

      visible.forEach((task) => {
        const li = document.createElement("li");
        if (task.completed) li.classList.add("completed");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.addEventListener("change", () => toggleTask(task.id));
        li.appendChild(checkbox);

        if (editingId === task.id) {
          const editInput = document.createElement("input");
          editInput.type = "text";
          editInput.className = "edit-input";
          editInput.value = task.text;
          editInput.maxLength = 120;
          editInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") saveEdit(task.id, editInput.value);
            if (e.key === "Escape") { editingId = null; render(); }
          });
          li.appendChild(editInput);
          setTimeout(() => editInput.focus(), 0);

          const saveBtn = makeIconBtn("✅", "Save", () => saveEdit(task.id, editInput.value));
          li.appendChild(saveBtn);
        } else {
          const span = document.createElement("span");
          span.className = "task-text";
          span.textContent = task.text;
          li.appendChild(span);

          li.appendChild(makeIconBtn("✏️", "Edit", () => { editingId = task.id; render(); }));
          li.appendChild(makeIconBtn("🗑️", "Delete", () => deleteTask(task.id)));
        }

        list.appendChild(li);
      });

      const left = tasks.filter((t) => !t.completed).length;
      counter.textContent = `${left} task${left === 1 ? "" : "s"} left`;
    }

    function makeIconBtn(icon, title, handler) {
      const b = document.createElement("button");
      b.className = "icon-btn";
      b.textContent = icon;
      b.title = title;
      b.addEventListener("click", handler);
      return b;
    }

    function addTask(text) {
      tasks.unshift({ id: Date.now(), text: text, completed: false });
      save();
      render();
    }

    function toggleTask(id) {
      tasks = tasks.map((t) => (t.id === id ? { ...t, completed: !t.completed } : t));
      save();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter((t) => t.id !== id);
      save();
      render();
    }

    function saveEdit(id, newText) {
      const text = newText.trim();
      if (text) {
        tasks = tasks.map((t) => (t.id === id ? { ...t, text } : t));
        save();
      }
      editingId = null;
      render();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addTask(text);
      input.value = "";
      input.focus();
    });

    filterBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        currentFilter = btn.dataset.filter;
        filterBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        render();
      });
    });

    clearBtn.addEventListener("click", () => {
      tasks = tasks.filter((t) => !t.completed);
      save();
      render();
    });

    function applyTheme(dark) {
      document.body.classList.toggle("dark", dark);
      themeBtn.textContent = dark ? "☀️" : "🌙";
      localStorage.setItem("theme", dark ? "dark" : "light");
    }

    themeBtn.addEventListener("click", () => {
      applyTheme(!document.body.classList.contains("dark"));
    });

    applyTheme(localStorage.getItem("theme") === "dark");
    render();
  </script>
</body>
</html>
